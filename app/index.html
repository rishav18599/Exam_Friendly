  --g1:#0d2347; --g2:#0a1a35; --g3:#07101f;
  --high:#ff9a85; --high-soft:rgba(255,120,90,.20); --med:#f0c458; --med-soft:rgba(240,196,88,.18); --low:#9db6d3; --low-soft:rgba(157,182,211,.16);

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 84px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-block:16px}
.wrap.wide{max-width:100%;padding-inline:0;margin-inline:0}
body:has(.wrap.wide){padding-inline:0}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.7rem;font-weight:700} h2{font-size:1.25rem;font-weight:700} h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.draftnote{background:var(--med-soft);color:var(--fg);border:1px solid var(--med);border-radius:8px;padding:8px 12px;font-size:.86rem}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;min-height:36px}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:12px}
.rank{font-family:var(--mono);color:var(--muted);font-size:.9rem}
.tname{font-weight:600;line-height:1.25;overflow-wrap:anywhere}

.pill.High{background:var(--high-soft);color:var(--high)} .pill.Medium{background:var(--med-soft);color:var(--med)} .pill.Low{background:var(--low-soft);color:var(--low)}
.scorebar{height:6px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}
.scorebar>i{display:block;height:100%;background:var(--accent)}
.detail{padding:4px 12px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.comp{display:grid;grid-template-columns:8.6rem minmax(0,1fr) 2.2rem;gap:8px;align-items:center;font-size:.86rem}
.comp .scorebar{margin:0}

.spark rect{fill:var(--accent)} .spark rect.zero{fill:var(--surface2)} .spark line{stroke:var(--line)}

.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:600}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.stem{font-size:1.05rem;overflow-wrap:anywhere}
.passage{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:.92rem;max-height:9rem;overflow:auto}
.stmts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.stmts li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:6px;overflow-wrap:anywhere}
.stmts b{font-family:var(--mono);color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--surface2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;overflow-wrap:anywhere}
.opt .k{font-family:var(--mono);color:var(--muted)}

.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:8px;padding:10px 12px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)} .feedback.na{background:var(--surface2)}
.nav{display:flex;gap:8px;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 1.5rem var(--display)}
.rec{padding:12px;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px}
.empty{padding:18px;text-align:center}
.bar2{display:grid;grid-template-columns:minmax(0,1fr) 3rem;gap:8px;align-items:center;font-size:.88rem}
.mods{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:4px 10px;font-size:.9rem}
.mods b{font-family:var(--mono)}
@media (prefers-reduced-motion:no-preference){.scorebar>i{transition:width .3s}}

/* Glass layer: clear white translucent panels with crisp edges and a sharp diagonal reflection. */
:root{--bg:#f4f7fb;--surface:rgba(222,233,247,.5);--surface2:rgba(255,255,255,.5);--line:rgba(110,130,160,.35);--g1:#ffffff;--g2:#eef3f9;--g3:#dfe8f3;
 --glass-blur:blur(10px) saturate(140%);--shadow:0 6px 18px rgba(30,50,80,.12);--inset:none;--edge:rgba(255,255,255,.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--surface:rgba(255,255,255,.10);--surface2:rgba(255,255,255,.10);--line:rgba(255,255,255,.28);--g1:#1b2430;--g2:#121821;--g3:#0b0f15;--shadow:0 6px 18px rgba(0,0,0,.5);--inset:none}}
:root[data-theme="dark"]{--bg:#10151c;--surface:rgba(255,255,255,.10);--surface2:rgba(255,255,255,.10);--line:rgba(255,255,255,.28);--g1:#1b2430;--g2:#121821;--g3:#0b0f15;--shadow:0 6px 18px rgba(0,0,0,.5);--inset:none}
body{background:radial-gradient(90% 45% at 20% 0,var(--g1),transparent 70%),linear-gradient(170deg,var(--g2),var(--g3)) fixed;background-color:var(--bg);min-height:100vh}
.card,.stat,.rec,.qcard,.tabs,.passage,.feedback,.opt,.chip,.btn.ghost{-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.card,.stat,.rec,.qcard,.opt,.chip,.btn.ghost{border:1px solid var(--line);box-shadow:var(--shadow),var(--inset)}
.card,.stat,.rec,.qcard{border-radius:16px;position:relative;overflow:hidden;isolation:isolate}
.card::before,.stat::before,.rec::before,.qcard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(45deg,transparent 0 56%,rgba(255,255,255,.85) 56% 100%)}
:root[data-theme="dark"] .card::before,:root[data-theme="dark"] .stat::before,:root[data-theme="dark"] .rec::before,:root[data-theme="dark"] .qcard::before{background:linear-gradient(45deg,transparent 0 56%,rgba(255,255,255,.14) 56% 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card::before,:root:not([data-theme="light"]) .stat::before,:root:not([data-theme="light"]) .rec::before,:root:not([data-theme="light"]) .qcard::before{background:linear-gradient(45deg,transparent 0 56%,rgba(255,255,255,.14) 56% 100%)}}
.opt{border-radius:12px;background:var(--surface)}.chip{border-radius:999px}
.btn{background:linear-gradient(180deg,#2f6fd6 0%,#1243a3 55%,#0c3380 100%);border:1px solid rgba(255,255,255,.6);border-radius:12px;box-shadow:0 4px 12px rgba(21,80,181,.3);position:relative;overflow:hidden;color:#fff}
.btn::after,.chip[aria-pressed="true"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(45deg,transparent 0 50%,rgba(255,255,255,.35) 50% 100%);transform:none}
.chip[aria-pressed="true"]{position:relative;overflow:hidden;background:linear-gradient(180deg,#2f6fd6,#1243a3);color:#fff;border-color:rgba(255,255,255,.6)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.opt.right{border-color:var(--good)} .opt.wrong{border-color:var(--bad)}
.opt[aria-pressed="true"],.opt.right,.opt.wrong{border-width:2px;padding:9px 11px}
.scorebar{background:rgba(120,140,170,.25);box-shadow:inset 0 1px 2px rgba(30,50,80,.2);height:8px;border-radius:4px}
.scorebar>i{background:linear-gradient(90deg,#3a7be0,#1550b5 60%,var(--gold));border-radius:4px}
.pill{border:0}
.tabs{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(30,50,80,.14);border-radius:18px 18px 0 0}
.tab{border-radius:12px}
.tab[aria-selected="true"]{color:var(--accent);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.4));box-shadow:none}

select,input{background:var(--surface);border:1px solid var(--line);border-radius:10px}

.btn:active{transform:scale(.97)}
}

/* Shine pass: stronger gloss half + moving glint, still one edge. */
body{background:radial-gradient(80% 40% at 15% 0,#ffffff,transparent 70%),radial-gradient(70% 40% at 100% 35%,#cfe0f5,transparent 70%),linear-gradient(165deg,#f7faff,#d3e1f3) fixed;background-color:#e6eef8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(80% 40% at 15% 0,#28406a,transparent 70%),linear-gradient(165deg,#16233a,#0a1019) fixed}}
:root[data-theme="dark"] body{background:radial-gradient(80% 40% at 15% 0,#28406a,transparent 70%),linear-gradient(165deg,#16233a,#0a1019) fixed}
.card,.stat,.rec,.qcard{background:linear-gradient(45deg,rgba(200,218,242,.55),rgba(240,246,255,.65))}
.card::before,.stat::before,.rec::before,.qcard::before{background:linear-gradient(45deg,transparent 0 52%,rgba(255,255,255,.55) 52% 100%)}
.card::after,.stat::after,.rec::after,.qcard::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:34%;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-160%) skewX(-20deg)}
.btn::after,.chip[aria-pressed="true"]::after{background:linear-gradient(45deg,transparent 0 48%,rgba(255,255,255,.2) 48% 100%)}
.btn::before,.chip[aria-pressed="true"]::before{content:"";position:absolute;top:-30%;bottom:-30%;left:0;width:35%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.8),transparent);transform:translateX(-200%) skewX(-20deg)}
.tab[aria-selected="true"]{background:linear-gradient(45deg,rgba(210,224,244,.7) 0 50%,rgba(255,255,255,.95) 50% 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .stat,:root:not([data-theme="light"]) .rec,:root:not([data-theme="light"]) .qcard{background:linear-gradient(45deg,rgba(255,255,255,.04),rgba(255,255,255,.12))}}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .rec,:root[data-theme="dark"] .qcard{background:linear-gradient(45deg,rgba(255,255,255,.04),rgba(255,255,255,.12))}
@media (prefers-reduced-motion:no-preference){

}

/* Lens shine: the divider passes through the middle of each box at 45 degrees; JS sets --lens to a path sized to the box. */
.card::before,.stat::before,.rec::before,.qcard::before{inset:0!important;width:auto!important;aspect-ratio:auto!important;background:var(--lens,none) 0 0/100% 100% no-repeat!important;opacity:.95}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card::before,:root:not([data-theme="light"]) .stat::before,:root:not([data-theme="light"]) .rec::before,:root:not([data-theme="light"]) .qcard::before{opacity:.22}}

 background-color:var(--tint);

 background-color:#d52a36;

.scorebar{overflow:visible}
.scorebar>i{position:relative;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.scorebar>i::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 55%);pointer-events:none;z-index:1}
.scorebar>i::after{content:'';position:absolute;right:-2px;top:50%;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.85) 25%,rgba(200,225,255,.4) 55%,rgba(255,255,255,0) 75%);box-shadow:0 0 3px 1px rgba(255,255,255,.95),0 0 7px 2px rgba(180,215,255,.5);pointer-events:none;z-index:2;animation:pyq-flare 2s ease-out infinite}
/* Music button sparkle ring */
@keyframes pyq-music-ring{
  0%  {transform:scale(1);opacity:.85}
  100%{transform:scale(2.6);opacity:0}
}
#pyq-music-btn{position:relative;overflow:visible}
#pyq-music-btn .pyq-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(127,178,255,.9);box-shadow:0 0 8px 3px rgba(127,178,255,.55);pointer-events:none;animation:pyq-music-ring .65s ease-out forwards}
/* ── Exact image option tabs (practice) ── */
.qcard .opts{gap:8px!important;border:none!important;overflow:visible!important;background:transparent!important;border-radius:0!important}
.qcard .opts .opt{
  border:none!important;border-radius:8px!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  background-color:transparent!important;
  background-image:url('./opt-default.png')!important;
  background-size:100% 100%!important;background-repeat:no-repeat!important;
  box-shadow:none!important;
  padding:14px 16px!important;min-height:56px;font-weight:700;isolation:auto;overflow:hidden}
.qcard .opts .opt::before{display:none!important}
.qcard .opts .opt::after{display:none!important}
.qcard .opts button.opt:not(.right):not(.wrong),
.qcard .opts button.opt:not(.right):not(.wrong) span,
.qcard .opts button.opt:not(.right):not(.wrong) .k{color:#1a1a1a!important;-webkit-text-fill-color:#1a1a1a!important}
.qcard .opts .opt[aria-pressed="true"]:not(.right):not(.wrong){background-image:url('./opt-correct.png')!important}
.qcard .opts .opt.right{background-image:url('./opt-correct.png')!important}
.qcard .opts button.opt.right,.qcard .opts button.opt.right span,.qcard .opts button.opt.right .k{color:#fff!important;-webkit-text-fill-color:#fff!important}
.qcard .opts .opt.wrong{background-image:url('./opt-wrong.png')!important}
.qcard .opts button.opt.wrong,.qcard .opts button.opt.wrong span,.qcard .opts button.opt.wrong .k{color:#fff!important;-webkit-text-fill-color:#fff!important}
/* ── option hover glow ── */
.opt:not(:disabled){transition:transform .15s cubic-bezier(.34,1.4,.64,1),filter .15s ease,outline-color .15s ease}
.opt:not(:disabled):not(.right):not(.wrong):hover{
  transform:scale(1.028);
  outline:2px solid rgba(255,255,255,.9);
  outline-offset:1px;
  filter:
    drop-shadow(0 0 2px rgba(255,255,255,1))
    drop-shadow(0 0 6px rgba(255,255,255,.85))
    drop-shadow(0 0 14px rgba(255,255,255,.55))
    drop-shadow(0 0 28px rgba(255,255,255,.28))
    drop-shadow(0 6px 18px rgba(0,0,0,.35));
  z-index:1;
}
.opt:not(:disabled):not(.right):not(.wrong):active{transform:scale(1.01)!important}
/* ── confirm modal ── */
.pyq-ov{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:pyqFd .18s ease}

.pyq-card-msg{font-family:var(--display);font-size:1.08rem;font-weight:700;line-height:1.35;text-align:center;text-wrap:balance}
.pyq-card-sub{font-size:.88rem;color:var(--muted);text-align:center;margin-top:-8px}
.pyq-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

a":"2","c":"MEDIUM","e":"Incipient cultivation is earliest plant domestication.","ps":19},{"i":"NET-ANT-P2-2025-DEC-Q097","p":10,"n":97,"t":"PASSAGE","u":5,"tp":"5.06","d":"HARD","s":"The passage reflects","o":["Structural approach in prehistory","Processual interpretation of prehistory","Culture-historical approach in prehistory","Materialistic interpretation of prehistory"],"a":"4","c":"LOW","e":null,"ps":19},{"i":"NET-ANT-P2-2025-DEC-Q098","p":10,"n":98,"t":"PASSAGE","u":5,"tp":"5.06","d":"MEDIUM","s":"Which of the following is a characteristic feature of Barbarism?","o":["Sedentary mode of life","Hunting and gathering activity","Use of alphabets","Trade and commerce"],"a":"1","c":"MEDIUM","e":"Barbarism is marked by food production and settled life.","ps":19},{"i":"NET-ANT-P2-2025-DEC-Q099","p":10,"n":99,"t":"PASSAGE","u":5,"tp":"5.06","d":"HARD","s":"The idea of social surplus in the context of preservation of food by hunters and fishers was proposed by","o":["Morgan and Childe","Hole and Heizer","Clark and Daniel","Chapple and Coon"],"a":"2","c":"LOW","e":null,"ps":19},{"i":"NET-ANT-P2-2025-DEC-Q100","p":10,"n":100,"t":"PASSAGE","u":5,"tp":"5.06","d":"MEDIUM","s":"According to V. Gordon Childe, the highest stage of social evolution is","o":["State and Kingdom","Agricultural Barbarism","Civilization","Monarchy"],"a":"3","c":"MEDIUM","e":"Childe placed Civilization as the highest stage.","ps":19}],"passages":["Books and articles often report research in a straightforward manner : Here's the problem, here's the answer—that kind of thing. But many researchers know from experience that knowledge does not always come in a straightforward manner. Now a professor at Rhode Island College, Terence E. Hays has reflected on the twists and turns in his fieldwork among the Ndumba in the Eastern Highlands province of Papua New Guinea. He first started studying whether different types of people (e.g., women and men) had different types of plant knowledge and whether they classified plants differently. In the course of his fieldwork, in 1972, he witnessed an initiation ceremony for 10 to 12-year-old males—a dramatic and traumatic rite of passage ceremony that included the physical trauma of nose-bleeding as well as the social traumas of 'attacks' by women and seclusion in the forest. The ceremony was full of symbolism of why the sexes needed to avoid each other. And while he collected stories and myths about plants for his research on ethnobiology, he kept uncovering themes in the stories about the danger of men associated with women. Hays' curiosity was aroused about these ceremonies and myths. How important are myths in perpetuating cultural themes? Do other societies that have separate men's houses have similar myths? He realized when he returned home from the field that many societies have similar stories. Are these stories generally linked to initiation rites and physical segregation of the sexes? Answering these questions required comparison, so he embarked on collecting myths and folk-tales from colleagues who worked in other New Guinea Highland societies. In the course of collecting these comparative materials, he realized he didn't have all the ethnographic information he needed, so he went back to field to get it. As Hays remarked \"as an ethnographer I was continually faced with questions, how do you know it's true? But even when I could reach a (hard-won) conviction that something was true for the Ndumba, the second question awaited : how do you know it's generally true, which you can't know about comparison?\"","Read the passage below and answer the questions that follow : Most of the comparative research on the relationship between economic development and political participation has been cross national, comparing data on different countries. Some countries are more democratic than others, on the basis of such characteristics as contested elections, an elected head of state, an elected powerful legislature, and the protection of civil liberties. In capitalist countries, more democracy is generally associated with higher levels of economic development, as measured by indicators such as per capita output. In countries that are not very industrialized there is little democracy at the national level. Why should more democracy be associated with more economic development? The prevailing opinion is that economic development increases the degree of social equality in the country; and the more equality among interest groups, the more they demand participation in the political process, and hence more democracy. Or, to put this theory another way, as the economy develops, the more the middle and working classes can demand rewards and power, and therefore the less power the elite can retain. What about the societies usually studied by anthropologists? We know that some of the highest levels of political participation occur in the least complex societies, such as foraging societies. Many adults in such societies have a say in the political decisions and leadership is informal. Leaders can retain their roles only if people voluntarily go along with them. Concentrated power and less political participation are more likely in chiefdoms and states than in band and tribal societies. The more heirarchical chiefdoms and societies usually depend on agriculture, which can produce more goods and services per capita than foraging economics can. So the relationship between economic development and political participation in the cross-cultural studies is opposite to what we find cross – nationally.","Read the passage below and answer the questions that follow : (91 – 95) In most societies in New Guinea, women did not traditionally participate in the resolution of disputes. And they could not bring actions against men. But when village courts were introduced, women began to go to court to redress offenses against them. In colonial times, the introduced western-style courts followed Western law, primarily Australian and British common law, not native customary law. After Papua New Guinea became an independent country, those courts remained in place. The lowest of the courts, called local courts, were located in town centers, often far from villages. In 1973, a new kind of court was created, called village courts, they were designed to settle local disputes in the villages, using a blend of customary law and western law. In contrast to local courts, magistrates in the village courts were selected from the pool of traditional and local leaders. When Richard Scaglion studied changes in village courts from 1977 to 1987, he noticed a shift towards an increased use of these courts by women. A joint study by Scaglion and Rose Whittingham revealed that when women approach the courts, the cases are mostly related to sex – related offenses (sexual jealousy, rape, incest, domestic disputes) committed by men. Most disputes in New Guinea villages are settled informally by self – help or by appeal to a \"big man\"; the courts are appealed to as a last resort. Women do not believe that they can get satisfaction informally. So they go to the village court, where they win some sort of punishment for the defendant in about 60 percent of the cases, just about the same rate that men achieve when they bring a case seeking punishment.","Read the passage below and answer the questions that follow : (96 – 100) Since the Neolithic, people have had to cope up with a host of new diseases that began as a consequence of changes in human behaviour. Over the past several decades, this has become a renewed source of concern following the resurgence of infectious diseases and the spread of a host of new and lethal diseases. More than thirty diseases, new to medicine have emerged in the past thirty five years. Perhaps the best known of these is AIDS, which has become a top killer among infectious diseases. But there are others - like Ebola hemorrhagic fever, which causes victims to bleed to death, and other hemorrhagic fevers like dengue fever, Lassa fever and hantavirus. Although it is not clear what has sparked the appearance and spread of these new diseases, one theory is that some are the result of human activities. In particular, road costruction and the intrusion of people into remote ecological settings, such as rainforests, along with worldwide shipping and airplane traffic, allow viruses and other infectious microbes to spread rapidly to large numbers of people. Most of the \"new\" viruses that have suddenly, afflicted humans are in fact old ones present in animals - such as monkeys (monkey pox), rodents (hanta virus), deer (Lyme disease) and insects (West Nile virus). What is different is that something has enabled them to jump from their animal hosts to humans. Large – scale habitat disturbance is an obvious explanation for such disease transfers. In a globalized world, as travel allows diseases to spread worldwide, we need a fuller understanding of how pathogens interact with their hosts if we are to devise effective preventive and therapeutic strategies to deal with them.","Read the passage below and answer the question that follow: With the acceptance of modern medical care among populations previously unexposed to European illness, infant mortality declined and life expectancies went up. These achievements largely came about because of the control of epidemic diseases, such as smallpox, cholera, yellow fever, syphilis, and tuberculosis as well as the inoculation of children. Overall deaths from infectious diseases may have declined, but other health problems have increased. A good deal of research has focused on the Samon of the South Pacific who traditionally depend on root and tree crop horticulture. Samoans increasingly moved to urban areas, worked for wages, and started buying most of their food. There was substantial increase, in a short time, in rates of hypertension, diabetes, and obesity accross a range of age groups. Could some genetic predisposition be interacting with mordenization to create obesity among them? James Neel suggested that individuals wh have efficient metabolisms and who can store calories in fatty tissue are likely to survive and reproduce in environement with frequent femines and chronic food shortages. In time, poulations in such environements would have a high prevalence of individuals with \"thrifty\" genes. When such individuals no longer need to exercise much or have access to high calorie food, it could lead to adult-onset diabetes, a scenerio consistent with the increase in diabetes in samoa.","Read the passage below and answer the question that follow: Ethnic conflicts appear to be on the rise. Such conflicts are often thought to be intractable and inevitable because they are supposedly based on ancient hatreds. But is that true? Social scientists are a long way from understanding the conditions that predict ethnic conflict, but they do know that ethnic conflicts are not necessarily ancient or inevitable. For example, an anthropologist who did fieldwork in the former Yugoslavia in the 1980s described villages where different ethnic groups have lived side by side for a long time without apparent difficulty. The differences between them were hardly emphasized. But by 1991, people complained about Serb domination of the Yugoslav government and there was talk of Croatia seceding symbols of Croat nationalism had appeared new place names a new flag-and Croates were now said to speak Croatian rather than the language they shared with the Serbs (Serbs-Croatian or Croato-Serbian). Ethnic violence erupted among Bosnian Serbs, Muslims, and Croats, and only the intervention of the United Nations established a precarious peace. Ethnic conflict is frequently associated with secessionist movements. That is secession often occurs after the eruption of ethnic conflict with all of the forced and voluntary immigration in the world, many countries are becoming more multiethnic or multicultural. The possibility of ethnic violence has become a global social problem.","Read the given paragraph and answer the five questions that follow It seems unreasonable to expect that the world, through the process of globalization, is moving relentlessly toward a single, benevolent, culturally homogeneous nation-state. News media every day report cultural differences throughout the world, with each group operating from its own unique cultural heritage and narrowly shared values and interests. If the many cultures of the world are not becoming a single homogeneous megaculture, a more workable approach would be some type of multiculturalism - that is, an official policy that recognizes the worth and integrity of different cultures at home and abroad. Such an approach requires the basic anthropological understanding that culturally different people are not inherently perverse or immoral. Rather it is possible to live together in peaceful coexistence, provided we understand the logic of culturally different people and are willing to negotiate with them in good faith and without exploitation. The alternative to multiculturalism is a world that is fragmented into ethnic enclaves: self-absorbed, provincial, fearful, uncooperative, militant, suspicious, and mean spirited. Multiculturalism remains the best hope for enabling all people to get the security, prosperity, and freedom they crave and deserve. And yet multiculturalism should not be seen as a totally selfless and altruistic philosophy. Rather it should be considered a win-win opportunity. The only way we can be safe and prosperous is if we enable our neighbours to be safe and prosperous.","Read the given passage and answer the five questions that follow Primate research takes place either in the laboratory or in the field. Two important ethical points raised in science and field research are: researchers are obliged to conduct themselves in a way that will allow other researchers continue to work in a given area and researchers must conduct their work on nonhuman primates continually keeping the adage 'do no harm' in mind. Biological anthropologists often observe the animals' behaviour without interfering with it. Only types of research that might raise ethical concerns in primatology, or other research involving live non-primate mammals, were scored. The types of research were categorised as: research on captive living primates; research on wild living primates; work on primate cadavers; work on primate museum specimens; and work on other living nonprimate animals.","Read the given paragraph and answer the five questions that follow: [Passage not transcribed: a long excerpt from Clifford Geertz, \"Deep Play: Notes on the Balinese Cockfight\", on the cockfight, status hierarchy and Balinese temperament. See PDF page 24 for the full text.]","Some areas of Harappa and Mohenjodaro served as bazaars, complete with shops. Archaeologists have inventoried the finds from artisans' quarters where bead makers, coppersmiths, cotton weavers, and other specialists manufactured and sold their wares. The potters' workshops were filled with painted pots decorated with animal figures and plain, ordinary wheel-made vessel manufactured not only in the cities but also in villages for hundreds of miles around. There were water jars and cooking bowls, storage pots and drinking vessels. Metal workers cast simple axes in open molds and manufactured chisels, knives, razors, spears and fishhooks. Only a few expert artisans made more elaborate objects like 'dancing girl' evidenced at Mohenjodaro. They would make a wax model of the cart and encast it in clay, which was fired to melt the wax. The molten copper or bronze was poured into the mould. This 'lost-wax' method is still used by Indian artists. The technologies used in Harappan cities had been developed centuries earlier in small villages and transferred to the cities without change.","Read the passage and answer the questions below: Vaccination programs in developing countries especially as promoted by UNICEF, are introduced with much fanfare. But they sometime met with little enthusiasm by the target population. In India many people are suspicious that vaccination programs are clandestine family planning programs (Nichter 1996). In other instances, fear of foreign vaccine prompts people to reject inoculation. Overall, the acceptance rates of vaccination are lower than Western public health planners expected. To understand why people reject inoculations, medical anthropologists conducted surveys in several countries. The result revealed that many parents have a partial or inaccurate understanding of what the vaccines protect against. Some people did not understand the importance of multiple vaccinations. Public health promoters incorporated findings from survey in two ways : 1. Educational campaigns for the public that addressed its concerns, 2. Education for the public health specialists about the importance of understanding and paying attention to local cultural practices and beliefs.","Read the passage and answer the question below: Excavations at the Neolithic settlement of Jericho revealed the remains of a sizable farming community inhabited as early as 10,350 years ago. Here in the Jordan River valley, crops could be grown almost continuously , due to the presence of a bounteous spring and the rich soil of an Ice Age lake that had dried up some 3,000 years earlier. In addition, flood-borne deposits originating in the Judean highlands to the west regularly renewed the fertility of the soil. To protect against these floods and associated mud flows, as well as invaders, the people of Jericho built massive wall of stone surrounding their settlement. Within these walls, which were 2 meters wide and 4 meters high and behind a large rock cut ditch, which was 8 meters wide and 2 3/4 meters deep, an estimated 400 to 900 people lived in house of mud brick with plastered floors. A stone tower that would have taken a hundred people over a hundred days to build was located inside one corner of the wall. A staircase inside it probably led to a mud-brick building on top. This massive wall- near mud-brick storage facilities as well as peculiar structures of possible ceremonial significance - provides evidence of social changes in these early farming communities. A village cemetery reflected the sedentary life of these early people. Close contact between the farmers of Jericho and other village is indicated by common features in art, ritual, use of prestige goods, and burial practices. Other evidence consists of obsidian and turquoise beads from Sinai as well as marine shells from the coast, all discovered inside the walls of Jericho.","Read the passage and answer the questions: Relative to common chimpanzees, bonobos live in a more restricted geographic range and are less divided than chimpanzees, who are divided into at least three well recognized subspecies. The area of suitable habitat available to bonobos may always have been smaller than that of their congeners to the north, especially during periodic contractions of the tropical forests of equatorial Africa, when much of the forest cover south of the Congo River was substantially reduced. Perhaps during these times, the bonobo populations passed through, bottle necks, resulting in the smaller effective population size (Ne). There could be little, if any social or reproductive factors that could give chimpanzees a larger Ne than bonobos: bonobos have a more equal adult sex ratio, and chimpanzee females are not more promiscuous than bonobo females. In contrast, there are many social and ecological differences between chimpanzees and gorillas that may result in lower Ne of gorillas. Gorillas live in smaller social groups, which contain one or two adult males who monopolize access to several females in the group, whereas chimpanzee females mate promiscuously within the social group. Species with strong polygyny, will have reduced male Ne, and therefore a lower overall Ne. In addition, compared to chimpanzees, gorillas live in a more restricted habitat. Thus, gorillas have more limited ecological tolerance than chimpanzees; and past environmental changes have sent them through several bottle necks, resulting in lower Ne.","Read the passage and answer the questions: Geertz's explanations are usually disguised in interpretive euphemisms, but they are there nonetheless. He is the most prolific euphemizer, circumventing the standard English word \"explain\" with such terms as \"render accessible\", \"dissolve the opacity of\", \"grasp\", \"clarify\", \"reduce the puzzlement of\", \"render intelligible\", \"interpret\", and of course \"thickly describe\". In spite of these circumlocutions and his programmatic statements to the contrary, however, Geertz gives believable explanations of much Balinese public behavior as culture. For example, in the first few pages of \"Deep Play: Notes on a Balinese Cockfight,\" Geertz explains why the Indonesian government tries to stop cockfighting, opium smoking, begging, and the uncovering of breasts (it sees them \"as primitive, backward, unprogressive, and generally unbecoming an ambitious nation\"); why illegal cockfights can be held in the village (the officials are bribed), why he and his wife were accepted by the villagers (they showed their solidarity by fleeing with the villagers from a police raid); why Balinese men are obsessed with their fighting cocks (fighting cocks are masculine symbols par excellence); why babies are not allowed to crawl and children's teeth are filed (to distinguish them beasts, which are abhorred); and so on.","Comprehension: Read the following passage carefully and answer the questions. Science is a process, not a result. The process involves observation of a natural phenomenon with some deduction about its cause. This leads the researcher to pose a hypothesis – a preliminary explanation. Armed with this hypothesis, the scientists test it (experimentation) by collecting of evidence (data) that either supports or refutes the hypothesis. It is the way scientists proceed when they have a question that needs answering or a possible explanation for a natural phenomenon that needs testing. The scientist would gather evidence from the data to test hypothesis. There are always alternative hypotheses. The common principles of conducting a research study include voluntary participation, informed consent and confidentiality. Researcher collect data using interview techniques and observational methods for which we generally assume the competence of the participant to be able to consent for the study.","Comprehension: Read the following passage carefully and answer the questions: The advanced capitalist countries, particularly the United State, are proponents of neoshamanism, a movement that idealizes the shamanistic practices of Native American and other indigenous peoples around the world. In the jungles and the tundra, shamanism is dying. An intensely local kind of knowledge is being abandoned in favour of various kinds of knowledge which are cosmopolitan and distant-led. Meanwhile, something called shamanism thrives in western magazines sweat lodges and weekend workshops. The New Age Movement, which includes this strand of neo-shamanism, is in part a rebellion against the principle of distant-led knowledge. In contrast to a traditional shaman who is oriented to serving the group under ASC, New Age Neo-shamanism offers a haven for educated, middle-class Westerners uncomfortable with conventional institutionalized congregations and unwilling to limit themselves to strictly materialistic pursuits.","Comprehension: The discovery of the AB0 blood group system in 1900 and the proof that these blood types are inherited was an outstanding example of Mendelian inheritance applied to a human character. In 1908, a mathematician and physician, set out the fundamental theorem of population genetics, which explains why a dominant gene does not increase in frequency from generation to generation. Scientists demonstrated that A, B, and 0 blood group characters are due to multiple alleles at one locus. Years later, the combined efforts of researchers led to discovery of the Rh factor and established that hemolytic disease of the newborn owes its origin to immunological maternal–fetal incompatibility. A recent reprint of Davenport's 1911 book, Heredity in Relation to Eugenics, is accompanied by thoughtful reflections from contemporary geneticists on Davenport's eugenic concepts and recommendations almost one hundred years later. The stage was set for the demonstration in the 1960s that Rh hemolytic disease of the newborn can be prevented by administration of anti-Rh antibodies to mothers at risk.","Comprehension: Nomothetic research aims to identify laws about human behavior – the Greek word 'nomos' means 'law'. It assumes that it is possible to discover regularities of influence or behavior, allowing experts to predict the likely outcomes of possible actions or innovations. So it looks for general principles, not specific cases. Idiographic research, by contrast, is all about exploring individuality or uniqueness. Idiographic research tends to focus on a single example, which might be a person, an event, a phenomenon, or an organization, and to analyse that example in depth. As a result, idiographic methods are often used in case studies, and are characteristic of ethnographic research. Idiographic studies are likely to adopt an inductive rather than deductive approach, working on the idea that we may discover general principles through a deeper understanding of one or two instances, rather than by looking for common factors. Each type of research has its strengths: identifying common laws or principles has proved valuable in many areas of the social sciences, while studying uniqueness has brought useful insights and has often been the key to opening up new research areas.","Comprehension: Read the passage carefully and answer the following questions: Around 1910, most anthropologists and anatomists believed that stature and other dimensions of the body such as head shape, could be used as \"racial\" markers. The word \"race\" is set in inverted commas here because it refers to the scientifically discredited notion that human beings can be organised into biologically distinct groups based on phenotypes. According to the fallacious idea, northern European \"races\" were tall and had relatively long and narrow heads, while southern and eastern European races were shorter and had relatively round skulls. Boas found that generally, the children of Italian and eastern European Jewish migrants to the United States were significantly taller and heavier than their parents.","Comprehension: Read the passage carefully and answer the following questions: If the stages of economic and social evolution are to be defined on technological bases, food production should surely mark the beginning of a major stage. I propose therefore to use it to define the transition from Savagery to Barbarism and so far to allow Barbarism and Neolithic to coincide. Yet a case can be made out for the retention of Morgan's criterion–pottery. On the archaeological evidence it is clear that pottery was unknown to Paleolithic hunters, fishers and collectors and was best invented rather late in the Mesolithic. On the other hand, it is quite certain that pots were made by some food gatherers and it is probable that in some regions they were so made before the Neolithic farmers had reached the vicinity."],"units":[{"unit":1,"title":"History, scope, research methods and statistics"},{"unit":2,"title":"Evolution, primates and human evolution"},{"unit":3,"title":"Human variation and human genetics"},{"unit":4,"title":"Human growth, adaptation and demography"},{"unit":5,"title":"Prehistoric archaeology and world prehistory"},{"unit":6,"title":"Indian prehistory and protohistory"},{"unit":7,"title":"Social-cultural anthropology: concepts and institutions"},{"unit":8,"title":"Anthropological theories"},{"unit":9,"title":"Indian anthropology and Indian society"},{"unit":10,"title":"Applied anthropology and development"}]};
</script>
<script>
(function(){
const P = DATA.pred, Q = DATA.q, PAS = DATA.passages, UNITS = DATA.units, PAPERS = P.method.cycles;
const TOPIC = {}; P.topics.forEach(t => TOPIC[t.id] = t);
const TYPE = {MCQ:'Direct',MULTI_STATEMENT:'Statements',SEQUENCE:'Sequence',MATCH_THE_FOLLOWING:'Matching',ASSERTION_REASON:'Assertion-reason',TWO_STATEMENTS:'Two statements',PASSAGE:'Passage'};
function renderPassage(raw,cls){
  const d=document.createElement('div');if(cls)d.className=cls;
  if(raw.startsWith('[Passage not transcribed')||raw.startsWith('[passage not transcribed')){
    d.style.cssText='opacity:.7;font-style:italic;color:var(--muted)';
    d.textContent='⚠️ Passage text not available in database. Refer to the official question paper to read the full passage.';
    return d;
  }
  const m=raw.match(/^(Read\b[^.!?\n]{0,120}[.:]\s*)/i);
  if(m){
    const lbl=document.createElement('b');lbl.textContent=m[1].trimEnd();
    const gap=document.createElement('div');gap.style.height='10px';
    const body=document.createElement('span');body.textContent=raw.slice(m[0].length);
    d.appendChild(lbl);d.appendChild(gap);d.appendChild(body);
  } else {d.textContent=raw;}
  return d;
}
const KEY = 'pyqp-demo-attempts-v1';
let attempts = [];
try { attempts = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { attempts = []; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(attempts)); } catch(e) {} }

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
const pct = x => Math.round(x*100) + '%';
const unitTitle = n => UNITS.find(u => u.unit === n).title;

/* ---------- state ---------- */
const S = { tab:'predict', unit:0, open:null, pf:{unit:'',topic:'',paper:'',diff:'',type:'',n:'10'}, sess:null, hint:'' };

/* ---------- derived stats ---------- */
function latestAttempts(){
  const m = {}; attempts.forEach(a => { m[a.id] = a; }); return Object.values(m);
}
function topicStats(){
  const st = {};
  latestAttempts().forEach(a => {
    if (a.ok === null) return;
    const s = st[a.tp] || (st[a.tp] = {n:0, ok:0}); s.n++; if (a.ok) s.ok++;
  });
  return st;
}
function recommendations(){
  const st = topicStats();
  return P.topics.map(t => {
    const s = st[t.id]; const acc = s ? s.ok / s.n : null;
    const weak = acc === null ? 0.5 : 1 - acc;
    return { t, s, acc, rec: 0.6*(t.score/100) + 0.4*weak };
  }).sort((a,b) => b.rec - a.rec);
}

/* ---------- views ---------- */
function header(title, sub){
  return h('header',{class:'top'}, h('div',{class:'eyebrow'}, 'UGC NET Anthropology · Paper II'), h('h1',null,title), sub ? h('p',{class:'muted'},sub) : null);
}

function spark(t){
  const W = 300, H = 56, n = t.per_cycle.length, bw = W/n, mx = Math.max(1, ...t.per_cycle);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg'); svg.setAttribute('viewBox',`0 0 ${W} ${H+16}`); svg.setAttribute('class','spark'); svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Questions on this topic in each paper, oldest to newest: ' + t.per_cycle.join(', '));
  t.per_cycle.forEach((v,i) => {
    const bh = v ? Math.max(3, v/mx*(H-12)) : 2;
    const r = document.createElementNS(ns,'rect'); r.setAttribute('x', i*bw+3); r.setAttribute('width', bw-6); r.setAttribute('y', H-bh); r.setAttribute('height', bh); r.setAttribute('rx',1.5);
    if (!v) r.setAttribute('class','zero'); svg.append(r);
    if (v){ const tx = document.createElementNS(ns,'text'); tx.setAttribute('x', i*bw+bw/2); tx.setAttribute('y', H-bh-3); tx.setAttribute('text-anchor','middle'); tx.textContent = v; svg.append(tx); }
  });
  const ln = document.createElementNS(ns,'line'); ln.setAttribute('x1',0); ln.setAttribute('x2',W); ln.setAttribute('y1',H); ln.setAttribute('y2',H); svg.append(ln);
  [[0,'start'],[n-1,'end']].forEach(([i,a]) => { const tx = document.createElementNS(ns,'text'); tx.setAttribute('x', a==='start'?2:W-2); tx.setAttribute('y',H+12); tx.setAttribute('text-anchor',a); tx.textContent = PAPERS[i]; svg.append(tx); });
  return svg;
}
function reasons(t){
  const out = [];
  out.push(`Asked in ${t.cycles_seen} of ${PAPERS.length} papers, about ${t.avg_per_paper} questions per paper.`);
  if (t.last_seen) out.push(t.papers_since_last === 0 ? `Appeared in the latest paper (${t.last_seen}).` : `Last seen in ${t.last_seen}, ${t.papers_since_last} paper${t.papers_since_last>1?'s':''} ago.`);
  out.push(t.trend === 'rising' ? 'Share of the paper has been rising.' : t.trend === 'falling' ? 'Share of the paper has been falling.' : 'Share of the paper has been steady.');
  return out;
}
function predictView(){
  const list = P.topics.filter(t => !S.unit || t.unit === S.unit);
  const top = P.topics.slice(0,3).map(t => t.name.split(' (')[0]);
  return [
    header('Topic priority for the next paper', `Ranked from the last ${PAPERS.length} papers, ${PAPERS[0]} to ${PAPERS[PAPERS.length-1]}. Highest first.`),
    h('div',{class:'chips', role:'group', 'aria-label':'Filter by unit'},
      h('button',{class:'chip','aria-pressed':String(!S.unit),onclick:()=>{S.unit=0;render();}},'All units'),
      UNITS.map(u => h('button',{class:'chip','aria-pressed':String(S.unit===u.unit),onclick:()=>{S.unit=u.unit;render();}},'Unit '+u.unit))),
    S.unit ? h('p',{class:'muted small'}, unitTitle(S.unit)) : h('p',{class:'muted small'}, `Strongest signals right now: ${top.join(', ')}.`),
    h('div',{class:'list'}, list.map(topicCard))
  ];
}
function topicCard(t){
  const open = S.open === t.id;
  const row = h('button',{class:'row','aria-expanded':String(open),onclick:()=>{S.open = open ? null : t.id; render(true);}},
    h('span',{class:'rank'}, '#'+t.rank),
    h('div',{style:'min-width:0'}, h('div',{class:'tname'}, t.name), h('div',{class:'tsub'}, `Unit ${t.unit} · ${t.total} questions`), h('div',{class:'scorebar'}, h('i',{style:`width:${t.score}%`}))),
    h('div',{style:'text-align:right'}, h('div',{class:'pill '+t.band}, t.band), h('div',{class:'mono small muted',style:'margin-top:4px'}, t.score.toFixed(0)+'/100')));
  const card = h('div',{class:'card'}, row);
  if (open){
    const names = {frequency:'Frequency',recurrence:'Recurrence',recency:'Recency',trend:'Trend'};
    const w = P.method.weights;
    card.append(h('div',{class:'detail'},
      h('div',{class:'list'}, Object.keys(names).map(k => h('div',{class:'comp'}, h('span',null,names[k]+' '+Math.round(w[k]*100)+'%'), h('div',{class:'scorebar'}, h('i',{style:`width:${t.components[k]}%`})), h('span',{class:'mono muted'}, t.components[k])))),
      h('div',null, h('div',{class:'eyebrow'},'Questions per paper'), spark(t)),
      h('ul',{class:'small',style:'margin:0;padding-left:18px'}, reasons(t).map(r => h('li',null,r))),
      Object.keys(t.formats).length ? h('p',{class:'small muted'}, 'Formats: ' + Object.entries(t.formats).map(([k,v]) => `${TYPE[k]||k} ${v}`).join(', ')) : null,
      h('div',null, h('button',{class:'btn small red',onclick:()=>{S.pf={unit:String(t.unit),topic:t.id,paper:'',diff:'',type:'',n:'10'}; startPractice(); S.tab='practice'; render();}}, 'Practice this topic'))));
  }
  return card;
}

/* ---------- practice ---------- */
function filteredQs(){
  const f = S.pf;
  return Q.filter(q => (!f.unit || String(q.u)===f.unit) && (!f.topic || q.tp===f.topic) && (f.paper==='' || String(q.p)===f.paper) && (!f.diff || q.d===f.diff) && (!f.type || q.t===f.type));
}
function sel(id,label,opts,val,onch){
  return h('div',{class:'field'}, h('label',{for:id},label), h('select',{id,onchange:e=>onch(e.target.value)}, opts.map(([v,t]) => h('option',{value:v,selected:String(val)===String(v)},t))));
}
function startPractice(){
  const pool = filteredQs();
  const n = Math.min(+S.pf.n || 10, pool.length);
  const shuffled = pool.map(q => [Math.random(), q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,n);
  S.sess = n ? { ids: shuffled.map(q=>q.i), idx:0, picks:{} } : null;
  S.hint = n ? '' : 'No questions match these filters.';
}
function practiceView(){
  if (S.sess) return sessionView();
  const f = S.pf;
  const topics = P.topics.filter(t => !f.unit || String(t.unit)===f.unit);
  const set = (k) => (v) => { S.pf[k]=v; if (k==='unit') S.pf.topic=''; render(true); };
  const count = filteredQs().length;
  return [
    header('Practice', 'Choose what to drill. Questions come from the 11 papers.'),
    h('div',{class:'grid2'},
      sel('f-unit','Unit',[['','All units'],...UNITS.map(u=>[String(u.unit),`${u.unit}. ${u.title}`])],f.unit,set('unit')),
      sel('f-topic','Topic',[['','All topics'],...topics.map(t=>[t.id,t.name])],f.topic,set('topic')),
      sel('f-paper','Paper',[['','All papers'],...PAPERS.map((p,i)=>[String(i),p])],f.paper,set('paper')),
      sel('f-diff','Difficulty',[['','Any'],['EASY','Easy'],['MEDIUM','Medium'],['HARD','Hard']],f.diff,set('diff')),
      sel('f-type','Format',[['','Any'],...Object.entries(TYPE)],f.type,set('type')),
      sel('f-n','Questions',[['5','5'],['10','10'],['20','20'],['50','50']],f.n,set('n'))),
    h('div',{style:'display:flex;gap:12px;align-items:center;flex-wrap:wrap'},
      h('button',{class:'btn',disabled:count===0,onclick:()=>{startPractice();render();}}, 'Start practice'),
      h('span',{class:'muted small'}, `${count} question${count===1?'':'s'} match`)),
    S.hint ? h('p',{class:'small',style:'color:var(--bad)'}, S.hint) : null
  ];
}
function sessionView(){
  const s = S.sess, id = s.ids[s.idx], q = Q.find(x => x.i===id), picked = s.picks[id];
  const answered = picked !== undefined;
  const done = s.ids.filter(i => s.picks[i] !== undefined).length;
  const t = TOPIC[q.tp];
  const kids = [
    h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'},
      h('button',{class:'btn ghost small',onclick:()=>{S.sess=null;render();}}, 'Back to filters'),
      h('span',{class:'mono muted small'}, `${s.idx+1} / ${s.ids.length}`))
  ];
  const meta = h('div',{class:'qmeta small muted'}, h('span',{class:'pill Low'}, PAPERS[q.p]+' · Q'+q.n), t ? h('span',null,t.name.split(' (')[0]) : null, h('span',null,TYPE[q.t]||q.t), q.d ? h('span',null,q.d.toLowerCase()) : null);
  const card = h('div',{class:'card qcard'}, meta);

  Q.filter(q => q.a && q.tp).forEach(q => { if (rnd() < 0.09){ const ok = rnd() < bias[q.tp]; const k = ok ? q.a : String(1 + Math.floor(rnd()*4)); out.push({id:q.i,tp:q.tp,u:q.u,sel:k,ok:k===q.a,ts:now-Math.floor(rnd()*6e8),sample:true}); } });

      const hdr=document.createElement('tr');const th1=document.createElement('th');th1.textContent='List I';const th2=document.createElement('th');th2.textContent='List II';hdr.appendChild(th1);hdr.appendChild(th2);tbl.appendChild(hdr);
      q.l1.forEach((a,i)=>{const tr=document.createElement('tr');const td1=document.createElement('td');td1.textContent=a[0]+'. '+a[1];const l2row=(q.l2||[])[i]||['',''];const td2=document.createElement('td');td2.textContent=l2row[0]+'. '+l2row[1];tr.appendChild(td1);tr.appendChild(td2);tbl.appendChild(tr);});
      wr.appendChild(tbl);return wr;
    })():null;
    const opts=document.createElement('div');opts.className='mk-opts';
    (q.o||[]).forEach((txt,i)=>{
      const ob=document.createElement('button');

    if(MK.cur>0){const pb=document.createElement('button');pb.className='btn ghost small';pb.textContent='\u2190 Prev';pb.addEventListener('click',()=>{MK.vis[MK.cur]=true;MK.cur--;render(true);});nav.appendChild(pb);}
    const mb=document.createElement('button');mb.className='btn ghost small';mb.textContent=MK.mrk[MK.cur]?'\u2605 Marked':'\u2606 Mark for Review';

    if(MK.cur<MK.qs.length-1){const nb=document.createElement('button');nb.className='btn small';nb.textContent='Next \u2192';nb.addEventListener('click',()=>{MK.vis[MK.cur]=true;MK.cur++;render(true);});nav.appendChild(nb);}
    qcard.appendChild(qn);qcard.appendChild(qt);if(qstmts)qcard.appendChild(qstmts);if(qmatch)qcard.appendChild(qmatch);qcard.appendChild(opts);qcard.appendChild(nav);
    const panel=document.createElement('div');panel.className='mk-panel';

      const pb2=document.createElement('button');let cls='mk-pq';

  } else {
    const sc=mkScore();
    const pct2=Math.round((sc.score/(MK.qs.length*2))*100);
    const scoreCard=document.createElement('div');scoreCard.className='mk-score-card';
    const snum=document.createElement('div');snum.className='mk-score-num '+(sc.score>=0?'good':'bad');snum.textContent=sc.score.toFixed(2);
    const slbl=document.createElement('div');slbl.textContent='Score (max '+MK.qs.length*2+')';
    const ssub=document.createElement('div');ssub.className='small muted';ssub.style.marginTop='4px';ssub.textContent=sc.correct+' correct \u00b7 '+sc.wrong+' wrong \u00b7 '+sc.skipped+' not attempted \u00b7 '+pct2+'%';
    const rbtn=document.createElement('button');rbtn.className='btn ghost small';rbtn.style.marginTop='8px';rbtn.textContent='Take Another Test';rbtn.addEventListener('click',mkReset);
    scoreCard.appendChild(snum);scoreCard.appendChild(slbl);scoreCard.appendChild(ssub);scoreCard.appendChild(rbtn);
    wrap.appendChild(scoreCard);
    const rhead=document.createElement('h3');rhead.style.cssText='margin-top:4px;font-size:1rem;font-weight:700';rhead.textContent='Answer Review';
    wrap.appendChild(rhead);
    MK.qs.forEach((q,i)=>{
      const row=document.createElement('div');row.className='mk-res-row';
      const userAns=MK.ans[i],correct=q.a;
      const icon=userAns==null?'\u2014':userAns===correct?'\u2713':'\u2717';
      const color=userAns==null?'var(--muted)':userAns===correct?'#22aa55':'#cc3030';
      const qtext=document.createElement('div');qtext.style.cssText='flex:1;min-width:0';
      const qhdr=document.createElement('div');qhdr.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:6px';
      const qnum=document.createElement('span');qnum.style.cssText='font-weight:700;font-size:.85rem;color:var(--muted)';qnum.textContent='Q'+(i+1);
      const qico=document.createElement('span');qico.style.cssText='color:'+color+';font-weight:700';qico.textContent=icon;
      qhdr.appendChild(qnum);qhdr.appendChild(qico);qtext.appendChild(qhdr);
      const qs_text=q.s||q.c||'';
      const qdiv=document.createElement('div');qdiv.style.cssText='font-size:.88rem;margin-bottom:4px';qdiv.textContent=qs_text;
      qtext.appendChild(qdiv);
      if(q.st&&q.st.length){const ul2=document.createElement('ul');ul2.className='stmts';ul2.style.cssText='margin-bottom:6px;font-size:.85rem';q.st.forEach(x=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=x[0];const sp=document.createElement('span');sp.textContent=x[1];li.appendChild(b);li.appendChild(sp);ul2.appendChild(li);});qtext.appendChild(ul2);}
      if(q.l1&&q.l1.length){const wr2=document.createElement('div');wr2.className='tblwrap';wr2.style.cssText='margin-bottom:6px;font-size:.85rem';const tbl2=document.createElement('table');const hdr2=document.createElement('tr');const rth1=document.createElement('th');rth1.textContent='List I';const rth2=document.createElement('th');rth2.textContent='List II';hdr2.appendChild(rth1);hdr2.appendChild(rth2);tbl2.appendChild(hdr2);q.l1.forEach((a,i)=>{const tr2=document.createElement('tr');const rtd1=document.createElement('td');rtd1.textContent=a[0]+'. '+a[1];const l2r=(q.l2||[])[i]||['',''];const rtd2=document.createElement('td');rtd2.textContent=l2r[0]+'. '+l2r[1];tr2.appendChild(rtd1);tr2.appendChild(rtd2);tbl2.appendChild(tr2);});wr2.appendChild(tbl2);qtext.appendChild(wr2);}
      if(q.ps!=null){const pg2=document.createElement('div');pg2.className='passage';pg2.style.cssText='font-size:.82rem;margin-bottom:6px';pg2.textContent=PAS[q.ps];qtext.appendChild(pg2);}
      (q.o||[]).forEach((txt,oi)=>{
        const span=document.createElement('span');let cls='mk-res-opt';
        if(oi+1===correct)cls+=' correct';
        if(oi+1===userAns&&oi+1!==correct)cls+=' wrong selected';
        if(oi+1===userAns&&oi+1===correct)cls+=' selected';
        span.className=cls;span.textContent=String.fromCharCode(65+oi)+'. '+txt;
        qtext.appendChild(span);qtext.appendChild(document.createTextNode(' '));
      });
      if(q.e){const exp=document.createElement('div');exp.style.cssText='font-size:.82rem;color:var(--muted);margin-top:6px;font-style:italic';exp.textContent='Explanation: '+q.e;qtext.appendChild(exp);}
      row.appendChild(qtext);wrap.appendChild(row);
    });
  }
  return [wrap];
}

/* ---------- confirm modal ---------- */
function showConfirm(msg, sub, onYes){
  const ov=document.createElement('div');ov.className='pyq-ov';
  const card=document.createElement('div');card.className='pyq-card';
  const icon=document.createElement('div');icon.className='pyq-card-icon';icon.textContent='?';
  const title=document.createElement('div');title.className='pyq-card-msg';title.textContent=msg;
  const btns=document.createElement('div');btns.className='pyq-btns';
  const noBtn=document.createElement('button');noBtn.className='btn ghost';noBtn.textContent='No, go back';
  noBtn.onclick=()=>ov.remove();
  const yesBtn=document.createElement('button');yesBtn.className='btn';yesBtn.textContent='Yes, confirm';
  yesBtn.onclick=()=>{ov.remove();onYes();};
  if(sub){const s=document.createElement('div');s.className='pyq-card-sub';s.textContent=sub;card.appendChild(icon);card.appendChild(title);card.appendChild(s);} else {card.appendChild(icon);card.appendChild(title);}
  btns.appendChild(noBtn);btns.appendChild(yesBtn);card.appendChild(btns);
  ov.appendChild(card);document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  setTimeout(()=>yesBtn.focus(),50);
}

<script>
/* Sizes the glossy half to each box: a 45 degree divider through the centre, ends flaring like a lens rim. */
(function(){
  var SEL='.card,.stat,.rec,.qcard,.btn,.chip,.opt';
  function lens(el){
    var w=el.clientWidth,h=el.clientHeight; if(!w||!h) return;
    var s=(w+h)/2, r=Math.max(6,Math.min(40,Math.min(w,h)*.3)), k=1.3*r, q=r*0.7071;
    var d;
    // A: where the divider meets the top or right edge. B: where it meets the left or bottom edge.
    var ax=Math.min(s,w), ay=Math.max(0,s-w), bx=Math.max(0,s-h), by=Math.min(s,h);
    var topA=ay===0, botB=by===h;
    var p=['M0 0'];
    if(topA){p.push('H'+(ax+k),'Q'+ax+' 0 '+(ax-q)+' '+q)}else{p.push('H'+w,'V'+(ay+k),'Q'+w+' '+ay+' '+(w-q)+' '+(ay+q))}
    if(botB){p.push('L'+(bx+q)+' '+(by-q),'Q'+bx+' '+by+' '+(bx-k)+' '+by,'H0')}else{p.push('L'+q+' '+(by-q),'Q0 '+by+' 0 '+(by-k))}
    p.push('Z');
    var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 "+w+" "+h+"'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='white'/><stop offset='1' stop-color='white' stop-opacity='.7'/></linearGradient></defs><path fill='url(#g)' d='"+p.join(' ')+"'/></svg>";
    el.style.setProperty('--lens','url("data:image/svg+xml,'+encodeURIComponent(svg).replace(/'/g,'%27').replace(/"/g,'%22')+'")');
  }
  var ro=window.ResizeObserver?new ResizeObserver(function(es){es.forEach(function(e){lens(e.target)})}):null;
  function scan(){document.querySelectorAll(SEL).forEach(function(el){if(el._lens)return;el._lens=1;lens(el);if(ro)ro.observe(el)})}
  new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
  scan(); window.addEventListener('resize',function(){document.querySelectorAll(SEL).forEach(lens)});
})();
</script>

<script>
(function(){
  var TRACKS = ['e47_DQIUjso','xdCLsPYKtC8'];
  var trackIdx = 0, player = null, ready = false, signedIn = false, inPractice = false;
  var fadeTimer = null, MAX_VOL = 72, playing = false;

  /* ── Hidden player container (off-screen, but real size for YT) ── */
  var playerId = 'pyq-yt-player-' + Date.now();
  var wrap = document.createElement('div');
  wrap.id = playerId;
  wrap.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:320px;height:180px;pointer-events:none;z-index:-1';
  document.body.appendChild(wrap);

  /* ── Small music toggle button ── */
  var musicBtn = document.createElement('button');
  musicBtn.id = 'pyq-music-btn';
  musicBtn.style.cssText = 'display:none;position:fixed;bottom:18px;right:14px;z-index:30;width:38px;height:38px;border-radius:50%;border:none;background:rgba(30,56,96,.75);color:#7fb2ff;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s';
  musicBtn.title = 'Toggle background music';
  musicBtn.textContent = '♫';
  document.body.appendChild(musicBtn);

  function fireRing(){
    var ring = document.createElement('span');
    ring.className = 'pyq-ring';
    musicBtn.appendChild(ring);
    ring.addEventListener('animationend', function(){ ring.remove(); });
  }

  function updateBtn(){
    musicBtn.style.opacity = playing ? '1' : '0.45';
    musicBtn.title = playing ? 'Pause background music' : 'Play background music';
  }
  musicBtn.addEventListener('click', function(){
    fireRing();
    if(!ready) return;
    if(playing){ stopNow(); }
    else if(signedIn && !inPractice){ fadeIn(); }
  });

  /* ── YouTube IFrame API ── */
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player(playerId, {
      width:'320', height:'180',
      videoId: TRACKS[0],
      playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,rel:0,playsinline:1,enablejsapi:1},
      events:{
        onReady: function(){
          ready = true;
          if(signedIn && !inPractice) startMusic();
        },
        onStateChange: function(e){
          var P = YT.PlayerState;
          playing = (e.data === P.PLAYING);
          updateBtn();
          if(e.data === P.ENDED){
            trackIdx = (trackIdx + 1) % TRACKS.length;
            player.loadVideoById(TRACKS[trackIdx]);
          }
        }
      }
    });
  };

  /* ── Fade helpers ── */
  function clearFade(){ if(fadeTimer){ clearInterval(fadeTimer); fadeTimer=null; } }

  function fadeIn(){
    if(!ready || !player) return;
    clearFade();
    player.setVolume(0);
    player.playVideo();
    var vol = 0, step = MAX_VOL / 50;
    fadeTimer = setInterval(function(){
      if(!player) return clearFade();
      vol = Math.min(vol + step, MAX_VOL);
      player.setVolume(Math.round(vol));
      if(vol >= MAX_VOL) clearFade();
    }, 100);
  }

  function stopNow(){
    clearFade();
    if(ready && player){ player.setVolume(0); player.pauseVideo(); }
    playing = false; updateBtn();
  }

  function startMusic(){ if(ready && player && signedIn && !inPractice) fadeIn(); }

  /* ── State detection (polling — simpler & more reliable than MO) ── */
  setInterval(function(){
    var hasAcct  = !!document.querySelector('.acct');
    var hasGate  = !!document.querySelector('.ag');
    var nowIn    = hasAcct && !hasGate;
    var nowPractice = nowIn && (!!document.querySelector('.qcard') || !!document.querySelector('.mk-wrap'));

    /* sign-in / sign-out */
    if(nowIn && !signedIn){
      signedIn = true;
      musicBtn.style.display = 'block';
      updateBtn();
      startMusic();
    } else if(!nowIn && signedIn){
      signedIn = false;
      musicBtn.style.display = 'none';
      stopNow();
    }

    /* practice start / end */
    if(nowIn){
      if(nowPractice && !inPractice){
        inPractice = true;
        stopNow();
      } else if(!nowPractice && inPractice){
        inPractice = false;
        startMusic();
      }
    }
  }, 500);
})();
</script>
